<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<div class="wrapper">
    <div class="top">
        <div class="title"><h1>My Blog</h1></div>
    </div>
    <div class="container d-flex flex-row container-fluid justify-content-between align-items-center">
        {% for post in blog_posts %}
            <div class="card col-lg-4 mb-3 d-flex align-items-stretch" style="width: 18rem;">
              <img src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fimages.pexels.com%2Fphotos%2F59990%2Fsunflowers-sunflower-yellow-petal-59990.jpeg%3Fcs%3Dsrgb%26dl%3Dpexels-pixabay-59990.jpg%26fm%3Djpg&f=1&nofb=1&ipt=2fd71c48924c9dd06498b26c93aa5b0269078cd85c48565d42e45fbd577fde83" class="card-img-top" alt="sunflower-image">
              <div class="card-body">
                <h5 class="card-title">{{post["title"]}}</h5>
                <p class="card-text">{{post["subtitle"]}}</p>
                <a href="{{url_for('get_post', post_id = post.id)}}" class="btn btn-primary">Read</a>
              </div>
            </div>
        {% endfor %}
    </div>
</div>
</body>
<footer class="position-absolute top-100 start-50 translate-middle">
    <p>Made with ♥️ in London.</p>
</footer>
</html>
